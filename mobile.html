<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Anggota · e-Parlemen DPRD Kota Magelang</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- QRCode JS for Personal QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- jsQR for real camera scanning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body style="background: #202422;">

  <div class="mobile-wrapper">

    <!-- Phone Simulator Device Frame -->
    <div class="device">
      
      <!-- Phone Notch -->
      <div class="phone-notch"></div>

      <!-- Phone Status Bar -->
      <div class="phone-statusbar">
        <span>09:41</span>
        <div class="icons">
          <svg viewBox="0 0 20 14" class="si-svg"><rect x="0" y="8" width="3" height="6" rx="0.6" fill="currentColor"></rect><rect x="5.5" y="5" width="3" height="9" rx="0.6" fill="currentColor"></rect><rect x="11" y="2" width="3" height="12" rx="0.6" fill="currentColor"></rect><rect x="16.5" y="0" width="3" height="14" rx="0.6" fill="currentColor"></rect></svg>
          <svg viewBox="0 0 20 16" class="si-svg"><path d="M1.5 5.8a13.5 13.5 0 0 1 17 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"></path><path d="M4.7 9.4a8.6 8.6 0 0 1 10.6 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"></path><circle cx="10" cy="13.2" r="1.5" fill="currentColor"></circle></svg>
          <svg viewBox="0 0 26 14" class="si-svg"><rect x="0.8" y="0.8" width="21.4" height="12.4" rx="3" stroke="currentColor" stroke-width="1.3" fill="none"></rect><rect x="2.4" y="2.4" width="17" height="9.2" rx="1.6" fill="currentColor"></rect><rect x="23" y="4.4" width="2.2" height="5.2" rx="1" fill="currentColor"></rect></svg>
        </div>
      </div>

      <!-- Mobile Simulator Waktu Bar -->
      <div class="time-simulator-bar" id="mobileTimeBar" style="padding: 6px 14px; font-size: 11px;"></div>

      <!-- Mobile App Header -->
      <header class="app-header">
        <div class="hdr-watermark">
          <svg viewBox="0 0 140 170" class="hdr-watermark-svg" xmlns="http://www.w3.org/2000/svg">
            <rect x="58" y="70" width="24" height="95" fill="#fff"></rect>
            <polygon points="46,70 70,26 94,70" fill="#fff"></polygon>
            <rect x="66" y="10" width="8" height="18" fill="#fff"></rect>
            <circle cx="70" cy="6" r="3" fill="#fff"></circle>
            <rect x="64" y="90" width="12" height="18" fill="#123424"></rect>
            <rect x="18" y="140" width="104" height="16" fill="#fff"></rect>
            <rect x="8" y="156" width="124" height="10" fill="#fff"></rect>
            <rect x="30" y="120" width="10" height="20" fill="#fff"></rect>
            <rect x="100" y="120" width="10" height="20" fill="#fff"></rect>
          </svg>
        </div>
        <div class="hdr-top-row">
          <div class="app-brand">
            <span class="emblem" style="width: 28px; height: 32px;">
              <svg viewBox="0 0 48 54" class="crest-svg" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 2 L44 9 V24 C44 37 36 47 24 52 C12 47 4 37 4 24 Z" fill="#0f2318" stroke="#e4c976" stroke-width="2"></path>
                <path d="M24 6 L40 11.5 V24 C40 34.5 33.5 42.5 24 47 C14.5 42.5 8 34.5 8 24 V11.5 Z" fill="none" stroke="#c9a24a" stroke-width="1"></path>
                <path d="M15 33 L19 18 L24 26 L29 18 L33 33 Z" fill="#c9a24a"></path>
                <path d="M17 33 H31 L29 39 H19 Z" fill="#d64545"></path>
              </svg>
            </span>
            <div>
              <div class="app-brand-title">e-Parlemen</div>
              <div class="app-brand-sub">DPRD KOTA MAGELANG</div>
            </div>
          </div>

          <div class="hdr-user-pill" id="mobHeaderUserPill"></div>
        </div>
      </header>

      <!-- Gelombang Merah Tipis Khas DPRD -->
      <div class="hdr-wave">
        <svg viewBox="0 0 400 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hdrWaveGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="var(--green-dark)"></stop>
              <stop offset="60%" stop-color="var(--green)"></stop>
              <stop offset="100%" stop-color="var(--green-mid)"></stop>
            </linearGradient>
          </defs>
          <path d="M0,12 C90,32 130,-6 220,10 C290,22 330,4 400,14 L400,0 L0,0 Z" fill="url(#hdrWaveGrad)"></path>
          <path d="M0,12 C90,32 130,-6 220,10 C290,22 330,4 400,14 L400,30 L0,30 Z" fill="var(--cream)"></path>
          <path d="M0,12 C90,32 130,-6 220,10 C290,22 330,4 400,14" fill="none" stroke="#c0392b" stroke-width="2.2" opacity=".85"></path>
        </svg>
      </div>

      <!-- Scrollable Mobile Body -->
      <main class="mobile-body" id="mobileMainContent"></main>

      <!-- Bottom Navigation (5 Menus) -->
      <nav class="bottom-nav">
        <button type="button" class="nav-item" data-mobtab="beranda">
          <span class="nav-icon"><svg class="ic-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
          <span>Beranda</span>
        </button>
        <button type="button" class="nav-item" data-mobtab="notifikasi">
          <span class="nav-icon" style="position:relative;">
            <svg class="ic-svg" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="nav-badge-dot" id="mobNotifBadgeDot" style="display:none;">3</span>
          </span>
          <span>Notifikasi</span>
        </button>
        <button type="button" class="nav-item" data-mobtab="scan">
          <span class="nav-icon" style="color:var(--gold);"><svg class="ic-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
          <span style="color:var(--gold); font-weight:700;">Scan QR</span>
        </button>
        <button type="button" class="nav-item active" data-mobtab="agenda">
          <span class="nav-icon"><svg class="ic-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
          <span>Agenda</span>
        </button>
        <button type="button" class="nav-item" data-mobtab="profil">
          <span class="nav-icon"><svg class="ic-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
          <span>Profil</span>
        </button>
      </nav>

    </div>

    <!-- Quick Navigation Link back to portal on Desktop -->
    <div style="margin-top:14px; text-align:center;">
      <a href="index.html" style="color:#aaa; font-size:12px; text-decoration:underline;">&larr; Kembali ke Portal Utama</a> · 
      <a href="admin.html" style="color:#aaa; font-size:12px; text-decoration:underline;">Buka Web Admin &rarr;</a>
    </div>

  </div>

  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/mobile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      Mobile.init();
    });
  </script>
</body>
</html>
